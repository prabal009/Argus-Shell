name: Native standalone and tagged release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish verified wheel/sdist using the protected pypi environment (tag ref only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python packaging/check_release_tag.py

  distributions:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --constraint packaging/constraints.txt . build twine packaging
      - run: python packaging/run_regressions.py --legacy
      - run: python -m build --outdir dist/packages
      - run: python -m twine check --strict dist/packages/*
      - run: python packaging/verify_distributions.py --dist dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/packages/*
          if-no-files-found: error

  standalone:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build onefile and onedir on the native host
        run: python packaging/build_standalone.py --install --mode both
      - name: Exercise frozen onefile and onedir including worker subprocesses
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python packaging/verify_runtime.py --executable dist/standalone/onefile/argus.exe
            python packaging/verify_runtime.py --executable dist/standalone/onedir/argus/argus.exe
          else
            python packaging/verify_runtime.py --executable dist/standalone/onefile/argus
            python packaging/verify_runtime.py --executable dist/standalone/onedir/argus/argus
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: |
            dist/standalone/*.tar.gz
            dist/standalone/*.zip
            dist/standalone/SHA256SUMS-*.txt
            dist/standalone/manifest-*.json
          if-no-files-found: error

  github-release:
    needs: [distributions, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: release-assets
      - name: Publish verified candidates on the existing version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "Argus $GITHUB_REF_NAME"
          fi

  pypi:
    # No tag-push automatic package upload. All gates are required; configure the
    # trusted publisher and required reviewers on the pypi environment first.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true && vars.ARGUS_ENABLE_PYPI == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [distributions, standalone, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/argus-shell/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Trusted publication of tested distributions only
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false

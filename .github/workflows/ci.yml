name: Cross-platform package and runtime

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-runtime:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - name: Install project and constrained build dependencies
        run: python -m pip install --constraint packaging/constraints.txt . build twine packaging
      - name: Portable language, native backend, and supported PTY regressions
        run: python packaging/run_regressions.py --legacy
      - name: Build source distribution and wheel
        run: python -m build --outdir dist/packages
      - name: Validate package metadata
        run: python -m twine check --strict dist/packages/*
      - name: Install and exercise wheel and sdist outside checkout
        run: python packaging/verify_distributions.py --dist dist/packages
      - name: Upload reviewed distribution candidates
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
